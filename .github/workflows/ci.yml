name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # arm64 runner with Xcode 16 (Swift 6), matching release.yml.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        run: swift test

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Web/terminal/pnpm-lock.yaml

      - name: Web client build and tests
        working-directory: Web/terminal
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test

  # CI builds debug only, so a release-only compiler crash (PR #211) reached
  # main. Same runner and toolchain as the test job.
  release-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift release build
        run: swift build -c release --product kitterm

  # Flags removed assertions, added skips, snapshot changes and workflow edits.
  # A "Chartered:" line in the PR body passes it (scripts/test-diff-guard.sh).
  test-diff-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test diff guard
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/test-diff-guard.sh "origin/$BASE_REF" "$HEAD_SHA"

  # The daemon ships to Linux containers, so a Darwin-only import or an
  # unavailable Foundation type has to fail here rather than in someone's box.
  # Compile only: `--build-tests` compiles every test target too, so a test
  # that uses an API the Linux toolchain lacks fails here and not on the
  # first Linux machine that builds the tests. Nothing runs: 35 test files
  # use Bundle(for:), which corelibs-XCTest does not have, so `swift test`
  # cannot run on Linux (`docs/goals/linux-tests-compile/goal.md`).
  linux-build:
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4

      # The container runs as root while the checkout is owned by the runner
      # user; without this git refuses to read the repository.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Swift build
        run: swift build --build-tests
