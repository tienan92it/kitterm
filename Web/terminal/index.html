<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="kitterm" />
    <!-- `crossorigin="use-credentials"`: a manifest is fetched with credentials
         mode "omit" by default, so the browser sends no `kitterm_token` cookie
         and a token-gated daemon answers 403. Add to Home Screen then fails on
         every LAN, Tailscale and proxied origin. Scripts and styles are exempt
         because they already send the cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>kitterm</title>
  </head>
  <body>
    <div id="app">
      <div id="settings-root"></div>
      <div id="search" hidden></div>
      <div id="terminal" aria-label="Terminal"></div>
      <div id="status" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
