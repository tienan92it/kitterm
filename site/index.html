<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kitterm — your Mac's terminal, in any browser tab</title>
<meta name="description" content="A real shell in a browser tab that outlives the tab you opened it in. macOS, local by default.">
<meta property="og:title" content="kitterm — your Mac's terminal, in any browser tab">
<meta property="og:description" content="A real shell in a browser tab that outlives the tab you opened it in.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kitterm.dev/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%23161b22' stroke='%2330363d' stroke-width='2'/%3E%3Cpath d='M8 9 L14 16 L8 23' fill='none' stroke='%233fb950' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 9.5 L19 22.5' fill='none' stroke='%233fb950' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#3fb950;--bg:#0d1117;--panel:#131922;--line:#232b36;
  --fg:#e6edf3;--fg-bright:#fff;--muted:#9aa5b1;--dim:#6e7681;
  /* Display is monospace — with no screenshot, the type carries the terminal.
     Reading text stays in the system sans (SF Pro on macOS, kitterm's only
     platform) so the prose is comfortable rather than a wall of fixed pitch. */
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,'Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
code{font-family:var(--mono)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:3px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{display:inline-block;width:9px;height:1.02em;background:var(--accent);
  margin-left:9px;vertical-align:-.16em;animation:blink 1.15s step-end infinite}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}

/* One column, centred in the viewport. */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:42px;padding:56px 24px;text-align:center}

.brand{display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:24px;font-family:var(--mono);font-weight:600;
  color:var(--fg-bright);font-size:15px}

h1{margin:0;font-family:var(--mono);font-size:clamp(25px,5.6vw,36px);line-height:1.3;
  font-weight:500;letter-spacing:-.6px;color:var(--fg-bright)}
.sub{margin:20px auto 0;font-size:15.5px;color:var(--muted);max-width:30em;text-wrap:pretty}

.action{width:100%;max-width:520px}
/* The command itself stays left-aligned inside the centred block — you read a
   shell line from the prompt, not from the middle. */
.cmd{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:var(--mono);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px 16px}
.cmd:hover{border-color:#313b49}
.cmd code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.cmd .p{color:var(--accent)}
.cmd .ic{color:var(--dim);font-size:11.5px;flex-shrink:0;font-family:var(--sans)}
.cmd:hover .ic{color:var(--muted)}
.cmd.done{border-color:var(--accent)}
.cmd.done .ic{color:var(--accent)}
.under{margin:14px 0 0;font-size:13px;color:var(--dim)}
.under a{color:var(--accent);border-bottom:1px solid transparent}
.under a:hover{border-bottom-color:var(--accent)}
.fallback{margin:11px 0 0;font-size:12.5px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.fallback[hidden]{display:none}
.port{width:54px;background:var(--bg);border:1px solid var(--line);border-radius:4px;
  color:var(--fg);font-family:var(--mono);font-size:11.5px;padding:3px 5px;text-align:center}

.meta{display:flex;align-items:center;justify-content:center;gap:10px;
  margin:26px 0 0;font-family:var(--mono);font-size:12px;color:var(--dim)}
.meta a{display:flex;align-items:center;gap:6px}
.meta a:hover{color:var(--fg)}

@media (max-width:520px){
  main{padding:40px 22px;gap:34px}
  /* Never ellipsis a `curl | sh` line — hiding half the URL is the one thing
     a reader needs to see before running it. Wrap instead. */
  .cmd{align-items:flex-start}
  .cmd code{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-all}
}
</style>
</head>
<body>

<main>

  <div>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#161b22" stroke="#30363d" stroke-width="2"/><path d="M8 9 L14 16 L8 23" fill="none" stroke="#3fb950" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 9.5 L19 22.5" fill="none" stroke="#3fb950" stroke-width="2.6" stroke-linecap="round"/></svg>
      kitterm
    </div>
    <h1>Your Mac's terminal,<br>in any browser tab.<span class="caret"></span></h1>
    <p class="sub">A real shell — job control, TUIs, all of it — that outlives the tab you opened it in.</p>
  </div>

  <div class="action">
    <button class="cmd" id="copy" aria-label="Copy install command">
      <span class="p" aria-hidden="true">$</span>
      <code>curl -fsSL https://kitterm.dev/install.sh | sh</code>
      <span class="ic" id="ic" aria-hidden="true">copy</span>
    </button>
    <p class="under">Already installed? <a id="open" href="http://kitterm.localhost:3418/" target="_blank" rel="noopener">Open my terminal ↗</a></p>
    <p class="fallback" id="miss" hidden>
      Nothing there — run <code>kitterm start</code> first. Other port?
      <input class="port" id="port" inputmode="numeric" value="3418" aria-label="kitterm port">
    </p>
    <p class="meta">
      <a class="gh" href="https://github.com/tienan92it/kitterm" aria-label="kitterm on GitHub">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </p>
  </div>

</main>

<script>
(function () {
  "use strict";

  var INSTALL = "curl -fsSL https://kitterm.dev/install.sh | sh";
  var copy = document.getElementById("copy");
  var ic = document.getElementById("ic");
  copy.addEventListener("click", function () {
    navigator.clipboard.writeText(INSTALL).then(function () {
      ic.textContent = "copied";
      copy.classList.add("done");
      clearTimeout(copy._t);
      copy._t = setTimeout(function () {
        ic.textContent = "copy";
        copy.classList.remove("done");
      }, 1600);
    });
  });

  // A link, not a fetch: the daemon requires a loopback Host/Origin and a
  // cross-origin probe would be blocked by CORS, so the page cannot detect the
  // daemon. It opens it and explains the miss instead.
  var open = document.getElementById("open");
  var miss = document.getElementById("miss");
  var port = document.getElementById("port");
  try {
    var saved = localStorage.getItem("kitterm:port");
    if (saved) { port.value = saved; }
  } catch (e) { /* private mode */ }

  function sync() {
    var p = String(port.value || "3418").replace(/\D/g, "") || "3418";
    open.href = "http://kitterm.localhost:" + p + "/";
    try { localStorage.setItem("kitterm:port", p); } catch (e) { /* ignore */ }
  }
  port.addEventListener("input", sync);
  open.addEventListener("click", function () { miss.hidden = false; });
  sync();
})();
</script>
</body>
</html>
